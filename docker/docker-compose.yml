version: "3.8"

# Bluephish. `docker compose up -d` starts the application and nothing else.
#
# TheHive and MISP are optional integrations and live in
# docker-compose.integrations.yml; see ../docs/integracoes.md to run them.

services:

  thephish:
    restart: unless-stopped
    build:
      context: ../app
    image: thephish-custom:latest
    container_name: thephish
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      # Signing key for the session cookie. Set it in docker/.env (which is
      # gitignored) so that sessions survive a restart; when it is empty the
      # application falls back to a random per-process key and everybody is
      # signed out on restart.
      - THEPHISH_SECRET_KEY=${THEPHISH_SECRET_KEY:-}
      # Public origin, needed only behind a TLS-terminating proxy: the SSO
      # redirect URI has to match what is registered in Entra ID, and the
      # process only sees the internal address
      - BLUEPHISH_BASE_URL=${BLUEPHISH_BASE_URL:-}
      # Seconds a session survives with no sign of life from its browser tab
      - BLUEPHISH_TAB_GRACE_SECONDS=${BLUEPHISH_TAB_GRACE_SECONDS:-}
      # Name the authenticator app shows next to the second-factor code; only
      # worth setting when one phone is paired with more than one installation
      - BLUEPHISH_MFA_ISSUER=${BLUEPHISH_MFA_ISSUER:-}
    volumes:
      - ./thephish_conf_files/configuration.json:/root/thephish/configuration.json
      - ./thephish_conf_files/whitelist.json:/root/thephish/whitelist.json
      # SQLite database (users, whitelist state, analysis history, reclassifications,
      # verdict memory), audit trail, TLS key pair, volume alerts and the kept
      # originals and layouts: kept outside the image so they survive a rebuild
      - ./vol/thephish_data:/root/thephish/data
