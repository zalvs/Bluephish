# frontend do BluePhish: tudo para a API, por TLS interno — /static também.
#
# /static vem da API, e não de uma cópia nesta imagem: o HTML (da API) pede cada
# arquivo com ?v=<versão da imagem da API>, e uma cópia daqui, mais velha, seria
# servida sob a versão nova e guardada pelo navegador por uma semana. Reconstruir
# só a API, o jeito normal de publicar uma correção, quebraria o painel sem erro.
#
# A conversa com a API usa o certificado interno, diferente do do vhost, emitido
# pela CA que só esta instalação tem (app/cert_store.py). proxy_ssl_verify on: um
# contêiner que se fizesse passar pela API na rede backend não teria um
# certificado que essa CA assinou, e o frontend não fala com ele.

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 8080;
	server_tokens off;
	client_max_body_size 30m;

	resolver 127.0.0.11 valid=30s ipv6=off;
	set $api https://bluephish:8080;

	location / {
		proxy_pass $api;
		proxy_ssl_verify on;
		proxy_ssl_verify_depth 2;
		proxy_ssl_trusted_certificate /etc/nginx/trust/ca.pem;
		proxy_ssl_name bluephish;
		proxy_ssl_server_name on;
		proxy_ssl_protocols TLSv1.2 TLSv1.3;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $http_host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# Só o vhost fala com o frontend, e ele só serve HTTPS: não repassa o que o
		# cliente mandou
		proxy_set_header X-Forwarded-Proto https;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}
}
