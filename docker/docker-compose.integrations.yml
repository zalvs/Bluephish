version: "3.8"

# Optional integrations. None of this is needed to run Bluephish.
#
# Used together with the main file, from this directory:
#
#     docker compose -f docker-compose.yml -f docker-compose.integrations.yml up -d
#
# What is in here, and how to point Bluephish at it: ../docs/integrations.md

# Every service comes back by itself after a crash or a reboot of the machine
x-restarts: &restarts
  restart: unless-stopped

services:

  # Bluephish waits for the two record-keeping services when they are present
  thephish:
    depends_on:
      - thehive
      - misp

  # --- TheHive (a place the verdict can be recorded) -------------------------

  thehive:
    <<: *restarts
    image: thehiveproject/thehive4:4.1.9-1
    container_name: thehive
    depends_on:
      - cassandra
    ports:
      - '127.0.0.1:9000:9000'
    command: '--no-config --no-config-secret'
    volumes:
      - ./thehive/application.conf:/etc/thehive/application.conf
      - ./vol/data:/opt/data
      - ./vol/index:/opt/index

  cassandra:
    <<: *restarts
    image: cassandra:3.11
    container_name: cassandra
    hostname: cassandra
    environment:
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=1G
      - CASSANDRA_CLUSTER_NAME=thp
    volumes:
      - ./vol/cassandra-data:/var/lib/cassandra/data

  hive-ai-agent:
    <<: *restarts
    build: ../hive_ai_agent
    container_name: hive-ai-agent
    depends_on:
      - thehive
    ports:
      - '127.0.0.1:8008:8008'
    environment:
      - THEHIVE_URL=http://thehive:9000
      - THEHIVE_APIKEY=${THEHIVE_APIKEY:-}
      - LLM_API_ENDPOINT=${LLM_API_ENDPOINT:-http://host.docker.internal:11434/api/chat}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-llama3}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./hive_ai_agent_conf/configuration.json:/opt/hive_ai_agent/configuration.json

  # --- MISP (threat-intelligence platform TheHive can export to) --------------

  misp:
    <<: *restarts
    image: coolacid/misp-docker:core-v2.4.148a
    container_name: misp
    depends_on:
      - redis
      - mysql
    ports:
      - '127.0.0.1:80:80'
      - '127.0.0.1:443:443'
    environment:
      - "MYSQL_HOST=mysql"
      - "HOSTNAME=https://localhost"
      - "REDIS_FQDN=redis"
      - "INIT=true"
      - "CRON_USER_ID=1"
      - "DISIPV6=true"

  mysql:
    <<: *restarts
    image: mysql:8.0.26
    container_name: mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - "MYSQL_USER=misp"
      - "MYSQL_PASSWORD=example"
      - "MYSQL_ROOT_PASSWORD=password"
      - "MYSQL_DATABASE=misp"
    volumes:
      - ./vol/mysql:/var/lib/mysql

  redis:
    <<: *restarts
    image: redis:6.2.5
    container_name: redis
