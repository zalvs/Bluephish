# Signs TheHive's own session cookies. It MUST be unique per deployment:
# ../../setup.sh generates one here on first run. The placeholder below is
# not a key — a value committed to a public repository is a key everybody
# already has, and with it a session cookie can be forged.
play.http.secret.key="CHANGEME_GENERATED_BY_SETUP"

# JanusGraph
db {
  provider: janusgraph
  janusgraph {
    storage {
      backend: cql
      hostname: ["cassandra"]

      cql {
        cluster-name: thp       # cluster name
        keyspace: thehive           # name of the keyspace
        read-consistency-level: ONE
        write-consistency-level: ONE
      }
    }
     
    ## Index configuration
    index {
      search {
        backend: lucene
        directory: /opt/index
      }
    }  
  }
}

storage {
   provider: localfs
   localfs.location: /opt/data
}

play.http.parser.maxDiskBuffer: 50MB

# Cortex connector - removed. The analyzers used to run over there, dispatched
# by TheHive with api_thehive.run_analyzer(...); they now run inside the
# application itself (app/analyzers.py), so TheHive no longer needs to reach any
# Cortex server, and the whole "TheHive cannot authenticate against Cortex, so
# every analysis fails silently" failure mode is gone with it.

